# Fly.io Configuration for FastAPI Supply Chain Application
# https://fly.io/docs/reference/configuration/

app = "fastapi-supply-chain"
primary_region = "iad"

kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  ENVIRONMENT = "production"
  APP_NAME = "Supply Chain Management API"
  DEBUG = "false"
  RELOAD = "false"
  HOST = "0.0.0.0"
  PORT = "8080"
  API_V1_PREFIX = "/api/v1"
  RATE_LIMIT_ENABLED = "true"
  REDIS_ENABLED = "false"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[deploy]
  release_command = "alembic upgrade head"
