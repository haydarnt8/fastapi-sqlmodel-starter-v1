# Render Blueprint for FastAPI Supply Chain Application
# https://render.com/docs/blueprint-spec

services:
  # Web Service (FastAPI Application)
  - type: web
    name: fastapi-supply-chain
    runtime: python
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio
    plan: starter  # free, starter, standard, pro
    branch: Supply-Chain  # Current branch name
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: |
      alembic upgrade head
      gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/v1/health
    envVars:
      # Application
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Supply Chain Management API
      - key: DEBUG
        value: false
      - key: RELOAD
        value: false

      # Database (automatically set by Render PostgreSQL service)
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-supply-chain-db
          property: connectionString

      # Security - GENERATE THESE SECURELY!
      - key: SECRET_KEY
        generateValue: true  # Render will generate a secure random value
      - key: ALGORITHM
        value: HS256

      # JWT Token Expiration
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # CORS Origins (update with your frontend URLs)
      - key: BACKEND_CORS_ORIGINS
        value: https://yourdomain.com,https://www.yourdomain.com

      # First Superuser (Admin Account)
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@yourdomain.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false  # Set this as a secret in Render Dashboard
      - key: FIRST_SUPERUSER_FULLNAME
        value: System Administrator

      # Rate Limiting
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 60

      # Redis (optional - for production use Render Redis)
      - key: REDIS_ENABLED
        value: false  # Set to true if using Redis add-on
      # - key: REDIS_URL
      #   fromService:
      #     name: fastapi-redis
      #     type: redis
      #     property: connectionString

      # Logging
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

      # Database Settings
      - key: DB_ECHO
        value: false  # Set to true for debugging SQL queries
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10

      # API Configuration
      - key: API_V1_PREFIX
        value: /api/v1

      # Server
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000  # Render default port

  # PostgreSQL Database
  - type: pserv
    name: fastapi-supply-chain-db
    runtime: postgresql
    region: oregon  # Must match web service region
    plan: starter  # free (expires after 90 days), starter ($7/month), standard, pro
    databaseName: supply_chain_db
    databaseUser: supply_chain_user
    ipAllowList: []  # Empty = allow all (or restrict to specific IPs)

  # Redis (Optional - for caching and token revocation)
  # Uncomment if you need Redis
  # - type: redis
  #   name: fastapi-redis
  #   region: oregon
  #   plan: starter  # free (25MB), starter (256MB)
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []
